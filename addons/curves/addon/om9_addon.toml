# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_curves"
version = "0.1.0"
name = "Curve Tools"
tagline = "Menu Curve kiểu Matrix 9: Polyline, Circle, Arc, Helix…"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Curve"]

[[commands]]
id = "CurvePolylinePolyline"
label = "Polyline"
handler = "om9_addon_session"
interactive = true
aliases = ["Polyline"]
summary = "Vẽ đường gấp khúc gồm đoạn thẳng và cung tròn nối tiếp nhau."
steps = ["Bấm điểm đầu.", "Bấm các điểm tiếp theo (gõ x,y hoặc @dx,dy; gõ số = chiều dài đoạn).", "Mode=Arc: đoạn tiếp theo là cung tiếp tuyến với đoạn trước; Direction chọn hướng đầu cung, Center chọn tâm cung.", "Enter hoặc chuột phải để kết thúc; bấm lại điểm đầu để đóng."]
options = ["PersistentClose: luôn khép kín khi vẽ.", "Close: khép kín và kết thúc (từ điểm thứ 3).", "Mode=Line/Arc: vẽ đoạn thẳng hay cung tròn.", "Helpers: hiện đường gợi ý tiếp tuyến và trục X/Y.", "Length: khoá chiều dài đoạn tiếp theo.", "Undo: bỏ điểm vừa bấm."]

[[commands]]
id = "CurveLineSingleLine"
label = "Single Line"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Line"]
summary = "Vẽ một đoạn thẳng, kèm 9 kiểu dựng như Matrix: hai phía, vuông góc mặt, theo góc, thẳng đứng, 4 điểm, phân giác, vuông góc / tiếp tuyến đường cong, nối dài."
steps = ["Bấm điểm đầu (hoặc chọn một kiểu dựng trên dòng lệnh).", "Bấm điểm cuối, hoặc gõ chiều dài rồi bấm hướng."]
options = ["BothSides: điểm đầu là trung điểm.", "Normal: chọn mặt / khối / lưới, bấm điểm trên mặt; đường theo pháp tuyến (IgnoreTrims).", "Angled: đường gốc 2 điểm, gõ góc xoay, bấm điểm cuối.", "Vertical: đường vuông góc mặt phẳng làm việc.", "FourPoint: 2 điểm cho hướng, 2 điểm cho đầu và cuối.", "Bisector: đỉnh góc, cạnh đầu, cạnh cuối, rồi điểm cuối.", "Perpendicular: vuông góc từ đường cong; Point: từ một điểm tới đường cong; 2Curves: vuông góc chung hai đường cong.", "Tangent: tiếp tuyến tại điểm trên đường cong; Point: từ một điểm tiếp xúc đường cong; 2Curves: tiếp tuyến chung hai đường cong.", "Extension: nối dài đầu gần nhất của đường cong đã chọn."]

[[commands]]
id = "CurveFreeFormInterpolatePoints"
label = "Interpolate Points"
handler = "om9_addon_session"
interactive = true
aliases = ["InterpCrv"]
summary = "Vẽ đường cong trơn đi qua các điểm bấm."
steps = ["Bấm các điểm (bấm lại điểm đầu để khép kín trơn).", "Enter để kết thúc."]
options = ["Degree: bậc đường cong (1–11).", "Knots: kiểu nút Uniform (đều), Chord (theo khoảng cách), SqrtChord (căn khoảng cách).", "PersistentClose: luôn khép kín khi vẽ.", "StartTangent: bấm điểm đầu rồi hướng tiếp tuyến đầu.", "Close: khép kín trơn; Sharp: khép kín có góc gãy (từ điểm thứ 3).", "EndTangent: bấm điểm cuối rồi hướng tiếp tuyến cuối.", "Undo: bỏ điểm vừa bấm."]

[[commands]]
id = "CurveFreeFormControlPoints"
label = "Control Point Curve"
handler = "om9_addon_session"
interactive = true
aliases = ["Curve"]
summary = "Vẽ đường cong theo điểm điều khiển."
steps = ["Bấm các điểm điều khiển.", "Enter để kết thúc."]
options = ["Degree, Close, PersistentClose, Undo."]

[[commands]]
id = "CurveRectangleCornertoCorner"
label = "Rectangle"
handler = "om9_addon_session"
interactive = true
aliases = ["Rectangle"]
summary = "Vẽ hình chữ nhật: hai góc, từ tâm, 3 điểm hoặc đứng; có thể bo góc cung tròn hoặc conic."
steps = ["Bấm góc thứ nhất.", "Bấm góc đối diện, hoặc gõ chiều dài rồi chiều rộng (Enter = hình vuông)."]
options = ["3Point: hai đầu một cạnh rồi chiều rộng.", "Vertical: đứng vuông góc mặt phẳng làm việc.", "Center: từ tâm.", "Rounded: bo góc; gõ bán kính hoặc bấm điểm mà góc bo đi qua; Corner=Arc/Conic, Rho cho góc conic."]

[[commands]]
id = "CurveCircleCenterRadius"
label = "Circle"
handler = "om9_addon_session"
interactive = true
mesh_data = true
aliases = ["Circle"]
summary = "Vẽ đường tròn: tâm và bán kính, 2 điểm, 3 điểm, tiếp xúc đường cong, quanh đường cong hoặc khớp qua các điểm."
steps = ["Bấm tâm (hoặc chọn kiểu dựng).", "Bấm điểm trên đường tròn, hoặc gõ bán kính / đường kính / chu vi / diện tích."]
options = ["Deformable: đường tròn NURBS chỉnh được (Degree, PointCount).", "Vertical: đứng vuông góc mặt phẳng làm việc.", "2Point, 3Point: qua 2 / 3 điểm.", "Tangent: tiếp xúc 2 đường cong và bán kính, hoặc 3 đường cong; bấm gần tâm.", "AroundCurve: chọn đường cong, bấm tâm trên đó; đường tròn vuông góc đường cong.", "FitPoints: chọn điểm, đường cong hoặc lưới rồi Enter.", "Radius / Diameter / Circumference / Area: cách gõ kích thước.", "Orientation: bấm điểm cho hướng pháp tuyến của đường tròn."]

[[commands]]
id = "CurveEllipseFromCenter"
label = "Ellipse"
handler = "om9_addon_session"
interactive = true
aliases = ["Ellipse"]
summary = "Vẽ elip: từ tâm, hộp bao, đường kính, tiêu điểm, đứng hoặc quanh đường cong."
steps = ["Bấm tâm (hoặc chọn kiểu dựng).", "Bấm đầu trục thứ nhất.", "Bấm đầu trục thứ hai (hoặc gõ chiều dài)."]
options = ["Deformable: elip NURBS chỉnh được (Degree, PointCount).", "Vertical: trục thứ hai đứng theo pháp tuyến mặt phẳng làm việc.", "Corner: hai góc hộp bao (hoặc một góc khi đã có tâm).", "Diameter: hai đầu trục thứ nhất rồi trục thứ hai.", "FromFoci: hai tiêu điểm rồi một điểm trên elip; MarkFoci đặt điểm tại tiêu điểm.", "AroundCurve: chọn đường cong, tâm trên đường cong."]

[[commands]]
id = "CurveArcCenterStartAngle"
label = "Arc"
handler = "om9_addon_session"
interactive = true
aliases = ["Arc"]
summary = "Vẽ cung tròn từ tâm, điểm đầu và góc."
steps = ["Bấm tâm.", "Bấm điểm đầu.", "Bấm điểm cuối hoặc gõ góc."]

[[commands]]
id = "CurveArcStartEndDirection"
label = "Arc Start End Direction"
handler = "om9_addon_session"
interactive = true
aliases = ["ArcDirection"]
summary = "Vẽ cung tròn từ điểm đầu, điểm cuối và hướng tiếp tuyến."
steps = ["Bấm điểm đầu.", "Bấm điểm cuối.", "Bấm hướng tại điểm đầu."]

[[commands]]
id = "CurvePolygonCenterRadius"
label = "Polygon"
handler = "om9_addon_session"
interactive = true
aliases = ["Polygon"]
summary = "Vẽ đa giác đều từ tâm và bán kính."
steps = ["Bấm tâm.", "Bấm đỉnh hoặc gõ bán kính."]
options = ["NumSides: số cạnh.", "Circumscribed: ngoại tiếp."]

[[commands]]
id = "CurveSpiral"
label = "Spiral"
handler = "om9_addon_session"
interactive = true
aliases = ["Spiral"]
summary = "Vẽ đường xoắn ốc."
steps = ["Bấm tâm và các bán kính.", "Gõ số vòng."]
options = ["Turns: số vòng.", "Flat: xoắn phẳng."]

[[commands]]
id = "CurveHelix"
label = "Helix"
handler = "om9_addon_session"
interactive = true
aliases = ["Helix"]
summary = "Vẽ đường lò xo (helix)."
steps = ["Bấm đầu và cuối trục.", "Bấm/gõ bán kính."]
options = ["Turns: số vòng."]

[[commands]]
id = "CurvePointObjectSinglePoint"
label = "Point"
handler = "om9_addon_session"
interactive = true
summary = "Đặt một điểm."
steps = ["Bấm vị trí điểm."]
