[[commands]]
id = "CurveOffsetCurve"
label = "Offset Curve"
handler = "om9_addon_session"
interactive = true
aliases = ["Offset", "OffsetCrv"]
summary = "Offset đường cong như Rhino: đoạn thẳng giữ thẳng, cung giữ đồng tâm, góc polyline theo Corner; nằm trong mặt phẳng của đường cong."
steps = ["Select curve to offset: bấm đường cong (gõ số để đặt Distance).", "Side to offset: bấm phía cần offset."]
options = ["Distance=1.", "Corner=Sharp/Round/Smooth/Chamfer (chỉ góc phía ngoài).", "ThroughPoint: offset qua điểm bấm.", "Tolerance=0.001.", "BothSides: offset hai phía.", "InCPlane: offset trong CPlane thay vì mặt phẳng đường cong.", "Cap=None/Flat/Round: bịt hai đầu khi BothSides."]

