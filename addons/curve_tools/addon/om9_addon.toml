interactive = true
aliases = ["Crv2View"]
summary = "Tạo đường cong 3D từ một đường nhìn từ trên (Top) và một đường nhìn từ trước (Front)."
steps = ["Chọn đường Top và đường Front.", "Enter."]

[[commands]]
