# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_curve_tools"
version = "0.1.0"
name = "Curve Tools"
tagline = "Menu Curve kiểu Matrix: blend, offset, fillet, chiếu, giao, mặt cắt …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Curve"]

[[commands]]
id = "OthersCurveRebuild"
label = "Rebuild Curve"
handler = "om9_addon_session"
interactive = true
aliases = ["Rebuild", "RebuildCrv"]
summary = "Dựng lại đường cong với số điểm và bậc mới (đường cong được thay tại chỗ)."
steps = ["Chọn đường cong, Enter.", "Gõ số điểm.", "Gõ bậc (1 = polyline)."]

[[commands]]
id = "CurveCurveEditToolsRefitToTolerance"
label = "Refit to Tolerance"
handler = "om9_addon_session"
interactive = true
aliases = ["Refit", "FitCrv"]
summary = "Làm lại đường cong ít điểm nhất mà vẫn nằm trong dung sai."
steps = ["Chọn đường cong, Enter.", "Gõ dung sai (mm)."]

[[commands]]
id = "CurveBlendCurvesBlendCurves"
label = "Quick Curve Blend"
handler = "om9_addon_session"
interactive = true
aliases = ["BlendCrv", "QuickBlend"]
summary = "Nối hai đầu gần nhau của hai đường cong bằng đường chuyển tiếp mượt."
steps = ["Chọn hai đường cong.", "Continuity=Tangency/Curvature.", "Enter."]
options = ["Continuity: liên tục tiếp tuyến hoặc độ cong."]

[[commands]]
id = "CurveBlendCurvesBlendCrv"
label = "Adjustable Curve Blend"
handler = "om9_addon_session"
interactive = true
aliases = ["AdjustableBlend"]
summary = "Nối hai đường cong, chỉnh độ phình ở mỗi đầu."
steps = ["Chọn hai đường cong, Enter.", "Gõ độ phình đầu 1.", "Gõ độ phình đầu 2."]
options = ["Continuity: Tangency/Curvature."]

[[commands]]
id = "CurveBlendCurvesArcBlend"
label = "Arc Blend"
handler = "om9_addon_session"
interactive = true
aliases = ["ArcBlend"]
summary = "Nối hai đường cong bằng hai cung tròn (biarc) tiếp tuyến."
steps = ["Chọn hai đường cong.", "Enter."]

[[commands]]
id = "CurveCurveFrom2Views"
label = "Curve from 2 Views"
handler = "om9_addon_session"
interactive = true
aliases = ["Crv2View"]
summary = "Tạo đường cong 3D từ một đường nhìn từ trên (Top) và một đường nhìn từ trước (Front)."
steps = ["Chọn đường Top và đường Front.", "Enter."]

[[commands]]
id = "BuilderCrv2ViewHistory"
label = "Curve from 2 Views Builder"
