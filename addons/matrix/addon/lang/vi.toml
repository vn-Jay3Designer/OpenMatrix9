# Bảng dịch Tiếng Việt cho gói OM9 Matrix.
#
# Viết lại bằng lời của OM9 cho dễ hiểu, không chép tài liệu Matrix. Chế độ English dùng
# nguyên chữ của lệnh nên không cần file en.toml. Tên tiếng Anh luôn gõ được trên dòng lệnh.
#
# [menus]    tên menu chính và nhóm lệnh
# [commands] mã ô lệnh (catalog) → tên hiển thị
# [options]  tên lệnh con trên dòng lệnh → nhãn
# [values]   giá trị của lệnh con (Yes/No, Uniform …) → nhãn
# [phrases]  câu nhắc và thông báo; {} giữ nguyên phần chữ ở chỗ đó (số đo, tên …)

