options = ["MaintainHeight: mặt cắt co giãn theo bề ngang nhưng giữ chiều cao.", "Closed: quét kín quay về mặt cắt đầu (hai ray kín, từ hai mặt cắt).", "Simplify: None / Rebuild (số điểm) / Refit (dung sai) cho mặt cắt."]

