# Manifest của gói add-on. tools/ci/build-addons-windows.ps1 điền @ENTRY@/@PLATFORM@ theo nền tảng build.
schema_version = "1.0.0"
id = "om9_surfaces"
version = "0.1.0"
name = "Surfaces"
tagline = "Menu Surface kiểu Matrix: sweep, loft, patch, revolve, blend, fillet, offset …"
maintainer = "OpenMatrix9 contributors"
type = "add-on"
license = ["SPDX:LGPL-2.1-or-later"]
om9_version_min = "0.1.0"
platforms = ["@PLATFORM@"]
runtime = "native"
entry = "@ENTRY@"
tags = ["Surface"]

[[commands]]
id = "SurfaceSweepSweep1Rail"
label = "Sweep 1 Rail"
handler = "om9_addon_session"
interactive = true
aliases = ["Sweep1"]
summary = "Quét các mặt cắt dọc một đường ray như Rhino 5; mặt đi qua đúng từng mặt cắt."
steps = ["Chọn ray.", "Chọn các mặt cắt theo thứ tự (Point: bắt đầu/kết thúc tại một điểm), Enter.", "Chỉnh tuỳ chọn khi xem trước, Enter để tạo."]
options = ["Style: Freeform giữ góc với ray; Roadlike Top/Right/Front giữ theo trục cố định.", "Closed: quét kín quay về mặt cắt đầu (ray kín, từ hai mặt cắt).", "GlobalBlend: chuyển hình tuyến tính từ đầu đến cuối.", "Simplify: None / Rebuild (số điểm) / Refit (dung sai) cho mặt cắt."]

[[commands]]
id = "SurfaceSweepSweep2Rails"
