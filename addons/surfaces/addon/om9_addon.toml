[[settings]]
key = "sw_tolerance"
type = "length"
option = "SweepTolerance"
label = "Dung sai quét (mm)"
default = 0.001
min = 0.00001
max = 1.0
step = 0.001
commands = ["SurfaceSweepSweep1Rail", "SurfaceSweepSweep2Rails", "SurfaceSweepProfileSweep", "BuilderFourProfileSweep", "SurfaceSweepSweepMultiRail"]

[[settings]]
key = "sw2_closed"
type = "bool"
option = "Closed"
label = "Quét kín (2 ray)"
default = false
commands = ["SurfaceSweepSweep2Rails"]

[[settings]]
key = "sw2_simplify"
type = "enum"
option = "Simplify"
label = "Đơn giản mặt cắt (2 ray)"
choices = ["none", "rebuild", "refit"]
